function A(url, text, page) {
  return `<a href="${url}${page?("#page="+page):""}" target="_blank" rel="noopener">${text}</a>`;
}
function linkify(src, bank) {
  const m2 = /Module 2/.test(bank || "");
  let s = " " + src + " ";

  // AML transcripts (longest names first)
  Object.keys(AML_TR).sort((a,b)=>b.length-a.length).forEach(name => {
    if (s.includes(name)) {
      const [mod, file] = AML_TR[name];
      s = s.split(name).join(A((mod===1?F.tr1:F.tr2)+file, name));
    }
  });
  // AML slides
  s = s.replace(/Slides pp?\. ([\d\-, and]+)/g, (full, pgs) => {
    const first = (pgs.match(/\d+/) || [1])[0];
    return A(m2 ? F.amlSlides2 : F.amlSlides1, full, first);
  });
  // Raschka: pdf page given directly
  s = s.replace(/Raschka(?:(?!<\/?a)[\s\S]){0,90}?pdf pp?\. (\d+)(?:-\d+)?/g,
    (full, p) => A(F.raschka, full, p));
  s = s.replace(/(Raschka ch\. \d+)(?![^<]*<\/a>)/g, (full) => A(F.raschka, full));
  // Yang and Shami, Lee et al.
  s = s.replace(/Yang and Shami/g,
    A(F.yang, "Yang and Shami") + ' <span class="doi">' + A("https://doi.org/10.1016/j.neucom.2020.07.061","doi") + '</span>');
  s = s.replace(/Lee et al\./g, A(F.lee, "Lee et al."));

  // RUU lecture notes: page label like (1-5) or (2-7)
  s = s.replace(/\(([12])-(\d+)\)/g, (full, mod, pg) =>
    "(" + A(mod === "1" ? F.ruuNotes1 : F.ruuNotes2, mod + "-" + pg, pg) + ")");
  s = s.replace(/Notes (Def\.|Cor\.|Prop\.|Example|&sect;|§)/g, (full, kw) =>
    A(m2 ? F.ruuNotes2 : F.ruuNotes1, "Notes") + " " + kw);
  // RUU lecture decks
  s = s.replace(/Lecture ([12][A-D])(,? slides? ([\d]+))?/g, (full, id, _x, slide) => {
    const base = id[0] === "1" ? F.ruuLec1 : F.ruuLec2;
    return A(base + RUU_LEC[id], full, slide);
  });
  // Koller: book page -> pdf page + 37
  s = s.replace(/Koller(?:(?!<\/?a)[\s\S]){0,70}?book pp?\. (\d+)(?:-\d+)?/g,
    (full, p) => A(F.koller, full, parseInt(p,10) + 37));
  s = s.replace(/(Koller (?:&sect;|§|Def\.|Prop\.|Thm\.|Example|ch\.)[^&<,]*)(?![^<]*<\/a>)/g,
    (full) => A(F.koller, full));
  s = s.replace(/Cox 1946/g, A(F.coxPdf, "Cox 1946") +
    ' <span class="doi">' + A("https://doi.org/10.1119/1.1990764","doi") + '</span>');
  s = s.replace(/Cheeseman(?![^<]*<\/a>)/g, A(F.cheeseman, "Cheeseman"));
  return s.trim();
}


let sel = [], mode = "sample", POOL = [], order = [], done = {};

function readURL() {
  const q = new URLSearchParams(location.search);
  const raw = (q.get("m") || q.get("module") || "").trim();
  if (raw) sel = raw.split(/[,+ ]+/).map(v => parseInt(v,10)-1)
                    .filter(i => Number.isInteger(i) && i>=0 && i<BANKS.length);
  if (!sel.length) sel = [0];
  mode = q.get("mode") === "all" ? "all" : "sample";
}
function syncURL() {
  const q = new URLSearchParams();
  q.set("m", sel.map(i=>i+1).join(",")); q.set("mode", mode);
  const url = location.pathname + "?" + q.toString();
  history.replaceState(null, "", url);
  document.getElementById("permalink").innerHTML =
    `Link to this set: <a href="${url}">${location.origin + url}</a>`;
}
function chipRow(el, items, cur, cb) {
  const lbl = el.querySelector(".lbl"); el.innerHTML = ""; if (lbl) el.appendChild(lbl);
  items.forEach(([v,label]) => {
    const b = document.createElement("button");
    b.className="chip"; b.dataset.v=v;
    b.setAttribute("aria-pressed", String(Array.isArray(cur) ? cur.includes(v) : cur===v));
    b.textContent=label; b.onclick=()=>cb(v); el.appendChild(b);
  });
}
function paintChips() {
  chipRow(document.getElementById("bankPick"),
    BANKS.map((b,i)=>[i, b.name.replace(/ - .*/,"")]), sel,
    i => { if (sel.includes(i)) { if (sel.length>1) sel=sel.filter(v=>v!==i); }
           else sel=[...sel,i].sort((a,b)=>a-b); paintChips(); build(); });
  document.querySelectorAll("#modeSeg button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.mode === mode));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function build() {
  POOL = [];
  sel.forEach(i => BANKS[i].questions.forEach(q => POOL.push({...q, bank: BANKS[i].name})));
  order = POOL.map((_,i)=>i);
  if (mode === "sample") order = shuffle(order).slice(0, Math.min(10, order.length));
  syncURL();
  document.getElementById("poolInfo").textContent = mode === "sample"
    ? `${order.length} drawn at random from a bank of ${POOL.length}`
    : `all ${POOL.length} questions`;
  render();
}

function render() {
  done = {};
  scoreBox.hidden = true;
  document.getElementById("retry").hidden = true;
  document.getElementById("submit").disabled = false;
  document.getElementById("submit2").disabled = false;
  form.innerHTML = "";
  const multi = sel.length > 1;
  order.forEach((qi, n) => {
    const q = POOL[qi];
    const card = document.createElement("div");
    card.className="q"; card.dataset.qi=qi;
    const head = document.createElement("div");
    head.className="qhead";
    head.innerHTML = `<span class="qnum">Question ${n+1}</span>` +
      (multi ? `<span class="bankTag">${q.bank.replace(/ - .*/,"")}</span>` : "") +
      `<span class="tag">${TAG[q.type]}</span>`;
    card.appendChild(head);
    const text = document.createElement("p");
    text.className="qtext"; text.innerHTML=q.q; card.appendChild(text);
    if (q.type === "fill") {
      const inp=document.createElement("input");
      inp.type="text"; inp.placeholder="your answer"; inp.name="q"+qi; card.appendChild(inp);
    } else {
      const opts = q.type==="tf" ? ["True","False"] : q.options;
      const kind = q.type==="many" ? "checkbox" : "radio";
      opts.forEach((opt,oi)=>{
        const lab=document.createElement("label");
        lab.className="opt"; lab.dataset.oi=oi;
        lab.innerHTML=`<input type="${kind}" name="q${qi}" value="${oi}"><span>${opt}</span>`;
        card.appendChild(lab);
      });
    }
    const btn = document.createElement("button");
    btn.className="checkbtn"; btn.type="button"; btn.textContent="Check this answer";
    btn.onclick = () => checkOne(qi);
    card.appendChild(btn);
    form.appendChild(card);
  });
}

function normalize(s){ return s.toLowerCase().trim().replace(/\s+/g," ").replace(/[.?!]$/,""); }
const optText = (q,i) => q.type==="tf" ? ["True","False"][i] : q.options[i];

function checkOne(qi) {
  if (done[qi] !== undefined) return done[qi];
  const q = POOL[qi];
  const card = form.querySelector(`[data-qi="${qi}"]`);
  let ok=false, picked=[];

  if (q.type === "fill") {
    const inp = card.querySelector("input[type=text]");
    const given = normalize(inp.value);
    ok = q.answer.some(a=>{const n=normalize(a);
      return given===n || given===n+" theory" || given===n+" space" || given===n+" parameter";});
    inp.disabled = true;
    inp.style.borderColor = ok ? "var(--good)" : "var(--bad)";
  } else {
    picked = [...card.querySelectorAll("input:checked")].map(i=>+i.value);
    ok = picked.length===q.answer.length && picked.every(p=>q.answer.includes(p));
    card.querySelectorAll("label.opt").forEach(lab=>{
      const oi=+lab.dataset.oi;
      lab.querySelector("input").disabled=true;
      const isAns=q.answer.includes(oi), chosen=picked.includes(oi);
      if (isAns) { lab.classList.add("correct");
        const m=document.createElement("span"); m.className="mark g";
        m.textContent = chosen ? "correct" : "correct answer"; lab.appendChild(m); }
      else if (chosen) { lab.classList.add("wrong");
        const m=document.createElement("span"); m.className="mark b";
        m.textContent="your answer"; lab.appendChild(m); }
    });
  }

  card.querySelector(".checkbtn")?.remove();

  const why=document.createElement("div");
  why.className="why";
  why.innerHTML = `<b>${ok ? "Correct" : "Not quite"}</b>${q.why}`;
  card.appendChild(why);

  if (!ok) {
    const chosen = q.type==="fill"
      ? [] : picked.filter(i => !q.answer.includes(i));
    const missed = q.type==="fill"
      ? [] : q.answer.filter(i => !picked.includes(i));
    let html = "";
    chosen.forEach(i => {
      const custom = q.wrong && q.wrong[i];
      html += `<p><b>&ldquo;${optText(q,i)}&rdquo;</b> &mdash; ` +
        (custom || `not the answer here. The explanation above gives the one that is; the reading below settles it.`) + `</p>`;
    });
    if (q.type==="fill" && !ok) {
      html += `<p>The answer is <b>${q.answer[0]}</b>. ${(q.wrong && q.wrong.fill) || "Check the spelling and note that only the missing word goes in the box."}</p>`;
    }
    if (missed.length) {
      html += `<p><b>You missed:</b> ` + missed.map(i=>`&ldquo;${optText(q,i)}&rdquo;`).join(", ") +
        `. On a select-all, leaving a correct option out costs the same as adding a wrong one.</p>`;
    }
    if (html) {
      const wb=document.createElement("div");
      wb.className="wrongbox";
      wb.innerHTML=`<div class="l">Why your choice does not work</div>${html}`;
      card.appendChild(wb);
    }
  }

  const rn=document.createElement("div");
  rn.className="readnext";
  rn.innerHTML=`<div class="l">Read next</div>${linkify(q.src, q.bank)}` +
    `<div class="hint">Links open the file in the private repo. PDF page numbers are already converted, so <b>Koller book p. 16</b> opens at pdf page 53.</div>`;
  card.appendChild(rn);

  done[qi]=ok;
  if (Object.keys(done).length === order.length) showScore();
  return ok;
}

function showScore() {
  const total=order.length;
  const correct=order.filter(qi=>done[qi]).length;
  const pct=Math.round(correct/total*100);
  scoreBox.hidden=false;
  scoreBox.innerHTML=`
    <h2>${sel.map(i=>BANKS[i].name.replace(/ - .*/,"")).join(" + ")}</h2>
    <div class="pct">${correct} / ${total} &middot; ${pct}%</div>
    <div class="bar"><div></div></div>
    <div class="breakdown">${
      pct===100 ? "Every one. Draw another set to be sure it wasn't the shuffle."
      : pct>=80 ? "Solid. Read the Read next line on anything you missed."
      : pct>=50 ? "Worth another pass through the sources before the next draw."
      : "Start with the source material, then come back."}</div>`;
  requestAnimationFrame(()=>{scoreBox.querySelector(".bar > div").style.width=pct+"%";});
  document.getElementById("retry").hidden=false;
  document.getElementById("submit").disabled=true;
  document.getElementById("submit2").disabled=true;
}

function gradeAll(){ order.forEach(qi=>checkOne(qi));
  scoreBox.scrollIntoView({behavior:"smooth",block:"start"}); }

document.getElementById("submit").onclick=gradeAll;
document.getElementById("submit2").onclick=gradeAll;
document.getElementById("retry").onclick=()=>{render();window.scrollTo({top:0,behavior:"smooth"});};
document.getElementById("newSet").onclick=()=>{build();window.scrollTo({top:0,behavior:"smooth"});};
document.getElementById("modeSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  mode=b.dataset.mode;paintChips();build();};

readURL(); paintChips(); build();
</script>
</body>
</html>
