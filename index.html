<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous">
<title>Reasoning Under Uncertainty - Quiz</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1c1a; --muted: #6b6b66;
    --line: #dedcd6; --accent: #2f5d8a; --accent-soft: #e8f0f7;
    --good: #2f6b45; --good-soft: #e7f2ea; --bad: #8a3232; --bad-soft: #f7e9e9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --panel: #202225; --ink: #e8e8e4; --muted: #9b9b95;
      --line: #34363a; --accent: #7fb0dd; --accent-soft: #23303c;
      --good: #7fc79a; --good-soft: #1f2f26; --bad: #e08b8b; --bad-soft: #332323;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a; --panel: #202225; --ink: #e8e8e4; --muted: #9b9b95;
    --line: #34363a; --accent: #7fb0dd; --accent-soft: #23303c;
    --good: #7fc79a; --good-soft: #1f2f26; --bad: #e08b8b; --bad-soft: #332323;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); margin: 0; padding: 0 20px 80px;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { padding: 40px 0 0; }
  h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .tab {
    font: inherit; font-size: 15px; padding: 10px 18px; cursor: pointer;
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); margin-bottom: -1px;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .modtitle { font-size: 15px; color: var(--muted); margin: 0 0 18px; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 24px; }
  button.act {
    font: inherit; font-size: 14px; padding: 8px 16px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  button.act:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { opacity: .9; }
  button.act:disabled { opacity: .5; cursor: default; }

  .q { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin-bottom: 16px; }
  .qhead { display: flex; gap: 10px; align-items: baseline; margin-bottom: 4px; }
  .qnum { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .tag {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent);
    background: var(--accent-soft); padding: 2px 7px; border-radius: 4px; margin-left: auto;
  }
  .qtext { margin: 0 0 14px; }
  .qtext code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: 14px; }

  label.opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; }
  label.opt:hover { background: var(--accent-soft); }
  label.opt input { margin: 4px 0 0; flex: none; }
  .opt.correct { background: var(--good-soft); border-color: var(--good); }
  .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
  .mark { margin-left: auto; font-size: 13px; font-weight: 600; flex: none; }
  .mark.g { color: var(--good); }
  .mark.b { color: var(--bad); }

  input[type=text] {
    font: inherit; padding: 9px 12px; width: 100%; max-width: 320px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink);
  }

  .why { margin-top: 14px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 7px 7px 0; font-size: 14px; }
  .why b { display: block; margin-bottom: 3px; }
  .src { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .score { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; margin-bottom: 24px; }
  .score h2 { margin: 0 0 4px; font-size: 20px; }
  .pct { font-size: 34px; font-weight: 650; letter-spacing: -0.02em; }
  .bar { height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 12px 0 4px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .5s ease; }
  .breakdown { color: var(--muted); font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Reasoning Under Uncertainty</h1>
  <p class="sub">EN.605.745 &middot; practice quiz</p>
<p class="sub" style="margin:-10px 0 16px"><a href="review/" style="color:var(--accent)">Spaced review</a> &middot; <a href="reference/" style="color:var(--accent)">Definitions</a> &middot; <a href="workbench/" style="color:var(--accent)">Workbench</a> &middot; <a href="interpretations/" style="color:var(--accent)">Interpretations</a></p>
  <div class="picker">
    <div class="pickrow" id="bankPick"></div>
    <div class="pickrow">
      <div class="seg" id="modeSeg">
        <button data-mode="sample" aria-pressed="true">10 random</button>
        <button data-mode="all" aria-pressed="false">Everything</button>
      </div>
      <span class="poolinfo" id="poolInfo"></span>
      <button class="act" id="newSet">New draw</button>
    </div>
    <div class="permalink" id="permalink"></div>
  </div>
</header>

<p class="modtitle" id="modtitle"></p>

<div class="controls">
  <button class="act primary" id="submit">Submit answers</button>
  <button class="act" id="retry" hidden>Try again</button>
</div>

<div class="score" id="score" hidden></div>
<form id="quiz"></form>

<div class="controls">
  <button class="act primary" id="submit2">Submit answers</button>
</div>

</div>

<script src="banks.js"></script>
<script>
const BANKS = window.QUIZ_BANKS;

const form = document.getElementById("quiz");
const scoreBox = document.getElementById("score");
const TAG = { one:"one answer", many:"select all", tf:"true / false", fill:"fill in" };

/* ---- turn source citations into links that open the exact file and page ---- */
const REPO = "https://github.com/BarbosaRicardo/JHU-AI-Masters-Program/blob/main/";
const F = {
  ruuNotes1: REPO+"EN.605.745.81.FA26/module01/readings/Lecture_1_Notes_v2.pdf",
  ruuNotes2: REPO+"EN.605.745.81.FA26/module02/readings/Lecture%202%20Notes.pdf",
  koller:    REPO+"EN.605.745.81.FA26/Textbook/Probabilistic%20Graphical%20Models%20-%20Principles%20and%20Techniques.pdf",
  cheeseman: REPO+"EN.605.745.81.FA26/module02/readings/indefenseofprob.pdf",
  coxPdf:    REPO+"EN.605.745.81.FA26/module02/readings/ProbabilityFrequencyReasonableExpectation.pdf",
  amlSlides1:REPO+"EN.705.742.81.FA26/module01/readings/module01B_aml_hyperparameter.pdf",
  amlSlides2:REPO+"EN.705.742.81.FA26/module02/readings/module02B_aml_feature.pdf",
  raschka:   REPO+"EN.705.742.81.FA26/Textbook/Machine%20Learning%20with%20Pytorch%20and%20Scikit-Learn.pdf",
  yang:      REPO+"EN.705.742.81.FA26/module01/readings/Yang_Shami_Hyperparameter_Optimization.pdf",
  lee:       REPO+"EN.705.742.81.FA26/module02/readings/Efficient_sparse_coding_algorithms.pdf",
  tr1:       REPO+"EN.705.742.81.FA26/module01/transcripts/",
  tr2:       REPO+"EN.705.742.81.FA26/module02/transcripts/",
  ruuLec1:   REPO+"EN.605.745.81.FA26/module01/lectures/",
  ruuLec2:   REPO+"EN.605.745.81.FA26/module02/lectures/"
};
const RUU_LEC = { "1A":"Lecture%201A.pdf","1B":"Lecture%201B.pdf","1C":"Lecture%201C.pdf",
  "2A":"Lecture%202A%20-%20Logical%20Reasoning.pdf","2B":"Lecture%202B%20-%20Probability%20Misconceptions.pdf",
  "2C":"Lecture%202C%20-%20Probability%20Conceptions.pdf","2D":"Lecture%202D%20-%20Frequency%20vs%20Expectation.pdf" };
const AML_TR = {
  "Hyperparameter Optimization transcript":[1,"Hyperparameter%20Optimization_Captions_Default.txt"],
  "PSO and Bayesian Optimizations transcript":[1,"PSO%20and%20Bayesian%20Optimizations_Captions_Default.txt"],
  "Early Stopping transcript":[1,"Early%20Stopping%20in%20Optimization_Captions_Default.txt"],
  "Feature Selection and Extraction Introduction transcript":[2,"Feature%20Selection%20and%20Extraction%20Introduction_Captions_Default.txt"],
  "Feature Selection and Extraction transcript":[2,"Feature%20Selection%20and%20Extraction_Captions_Default.txt"],
  "Tf-Idf Features and Autoencoders transcript":[2,"Tf-Idf%20Features%20and%20Autoencoders_Captions_Default.txt"],
  "Autoencoder Example transcript":[2,"Autoencoder%20Example_Captions_Default.txt"],
  "Sparse Coding transcript":[2,"Sparse%20Coding_Captions_Default.txt"] };

function A(url, text, page) {
  return `<a href="${url}${page?("#page="+page):""}" target="_blank" rel="noopener">${text}</a>`;
}
function linkify(src, bank) {
  const m2 = /Module 2/.test(bank || "");
  let s = " " + src + " ";

  // AML transcripts (longest names first)
  Object.keys(AML_TR).sort((a,b)=>b.length-a.length).forEach(name => {
    if (s.includes(name)) {
      const [mod, file] = AML_TR[name];
      s = s.split(name).join(A((mod===1?F.tr1:F.tr2)+file, name));
    }
  });
  // AML slides
  s = s.replace(/Slides pp?\. ([\d\-, and]+)/g, (full, pgs) => {
    const first = (pgs.match(/\d+/) || [1])[0];
    return A(m2 ? F.amlSlides2 : F.amlSlides1, full, first);
  });
  // Raschka: pdf page given directly
  s = s.replace(/Raschka(?:(?!<\/?a)[\s\S]){0,90}?pdf pp?\. (\d+)(?:-\d+)?/g,
    (full, p) => A(F.raschka, full, p));
  s = s.replace(/(Raschka ch\. \d+)(?![^<]*<\/a>)/g, (full) => A(F.raschka, full));
  // Yang and Shami, Lee et al.
  s = s.replace(/Yang and Shami/g,
    A(F.yang, "Yang and Shami") + ' <span class="doi">' + A("https://doi.org/10.1016/j.neucom.2020.07.061","doi") + '</span>');
  s = s.replace(/Lee et al\./g, A(F.lee, "Lee et al."));

  // RUU lecture notes: page label like (1-5) or (2-7)
  s = s.replace(/\(([12])-(\d+)\)/g, (full, mod, pg) =>
    "(" + A(mod === "1" ? F.ruuNotes1 : F.ruuNotes2, mod + "-" + pg, pg) + ")");
  s = s.replace(/Notes (Def\.|Cor\.|Prop\.|Example|&sect;|§)/g, (full, kw) =>
    A(m2 ? F.ruuNotes2 : F.ruuNotes1, "Notes") + " " + kw);
  // RUU lecture decks
  s = s.replace(/Lecture ([12][A-D])(,? slides? ([\d]+))?/g, (full, id, _x, slide) => {
    const base = id[0] === "1" ? F.ruuLec1 : F.ruuLec2;
    return A(base + RUU_LEC[id], full, slide);
  });
  // Koller: book page -> pdf page + 37
  s = s.replace(/Koller(?:(?!<\/?a)[\s\S]){0,70}?book pp?\. (\d+)(?:-\d+)?/g,
    (full, p) => A(F.koller, full, parseInt(p,10) + 37));
  s = s.replace(/(Koller (?:&sect;|§|Def\.|Prop\.|Thm\.|Example|ch\.)[^&<,]*)(?![^<]*<\/a>)/g,
    (full) => A(F.koller, full));
  s = s.replace(/Cox 1946/g, A(F.coxPdf, "Cox 1946") +
    ' <span class="doi">' + A("https://doi.org/10.1119/1.1990764","doi") + '</span>');
  s = s.replace(/Cheeseman(?![^<]*<\/a>)/g, A(F.cheeseman, "Cheeseman"));
  return s.trim();
}


let sel = [], mode = "sample", POOL = [], order = [], done = {};

function readURL() {
  const q = new URLSearchParams(location.search);
  const raw = (q.get("m") || q.get("module") || "").trim();
  if (raw) sel = raw.split(/[,+ ]+/).map(v => parseInt(v,10)-1)
                    .filter(i => Number.isInteger(i) && i>=0 && i<BANKS.length);
  if (!sel.length) sel = [0];
  mode = q.get("mode") === "all" ? "all" : "sample";
}
function syncURL() {
  const q = new URLSearchParams();
  q.set("m", sel.map(i=>i+1).join(",")); q.set("mode", mode);
  const url = location.pathname + "?" + q.toString();
  history.replaceState(null, "", url);
  document.getElementById("permalink").innerHTML =
    `Link to this set: <a href="${url}">${location.origin + url}</a>`;
}
function chipRow(el, items, cur, cb) {
  const lbl = el.querySelector(".lbl"); el.innerHTML = ""; if (lbl) el.appendChild(lbl);
  items.forEach(([v,label]) => {
    const b = document.createElement("button");
    b.className="chip"; b.dataset.v=v;
    b.setAttribute("aria-pressed", String(Array.isArray(cur) ? cur.includes(v) : cur===v));
    b.textContent=label; b.onclick=()=>cb(v); el.appendChild(b);
  });
}
function paintChips() {
  chipRow(document.getElementById("bankPick"),
    BANKS.map((b,i)=>[i, b.name.replace(/ - .*/,"")]), sel,
    i => { if (sel.includes(i)) { if (sel.length>1) sel=sel.filter(v=>v!==i); }
           else sel=[...sel,i].sort((a,b)=>a-b); paintChips(); build(); });
  document.querySelectorAll("#modeSeg button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.mode === mode));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function build() {
  POOL = [];
  sel.forEach(i => BANKS[i].questions.forEach(q => POOL.push({...q, bank: BANKS[i].name})));
  order = POOL.map((_,i)=>i);
  if (mode === "sample") order = shuffle(order).slice(0, Math.min(10, order.length));
  syncURL();
  document.getElementById("poolInfo").textContent = mode === "sample"
    ? `${order.length} drawn at random from a bank of ${POOL.length}`
    : `all ${POOL.length} questions`;
  render();
}

function render() {
  done = {};
  scoreBox.hidden = true;
  document.getElementById("retry").hidden = true;
  document.getElementById("submit").disabled = false;
  document.getElementById("submit2").disabled = false;
  form.innerHTML = "";
  const multi = sel.length > 1;
  order.forEach((qi, n) => {
    const q = POOL[qi];
    const card = document.createElement("div");
    card.className="q"; card.dataset.qi=qi;
    const head = document.createElement("div");
    head.className="qhead";
    head.innerHTML = `<span class="qnum">Question ${n+1}</span>` +
      (multi ? `<span class="bankTag">${q.bank.replace(/ - .*/,"")}</span>` : "") +
      `<span class="tag">${TAG[q.type]}</span>`;
    card.appendChild(head);
    const text = document.createElement("p");
    text.className="qtext"; text.innerHTML=q.q; card.appendChild(text);
    if (q.type === "fill") {
      const inp=document.createElement("input");
      inp.type="text"; inp.placeholder="your answer"; inp.name="q"+qi; card.appendChild(inp);
    } else {
      const opts = q.type==="tf" ? ["True","False"] : q.options;
      const kind = q.type==="many" ? "checkbox" : "radio";
      opts.forEach((opt,oi)=>{
        const lab=document.createElement("label");
        lab.className="opt"; lab.dataset.oi=oi;
        lab.innerHTML=`<input type="${kind}" name="q${qi}" value="${oi}"><span>${opt}</span>`;
        card.appendChild(lab);
      });
    }
    const btn = document.createElement("button");
    btn.className="checkbtn"; btn.type="button"; btn.textContent="Check this answer";
    btn.onclick = () => checkOne(qi);
    card.appendChild(btn);
    form.appendChild(card);
  });
  KX(form);
}

function normalize(s){ return s.toLowerCase().trim().replace(/\s+/g," ").replace(/[.?!]$/,""); }
const optText = (q,i) => q.type==="tf" ? ["True","False"][i] : q.options[i];

function checkOne(qi) {
  if (done[qi] !== undefined) return done[qi];
  const q = POOL[qi];
  const card = form.querySelector(`[data-qi="${qi}"]`);
  let ok=false, picked=[];

  if (q.type === "fill") {
    const inp = card.querySelector("input[type=text]");
    const given = normalize(inp.value);
    ok = q.answer.some(a=>{const n=normalize(a);
      return given===n || given===n+" theory" || given===n+" space" || given===n+" parameter";});
    inp.disabled = true;
    inp.style.borderColor = ok ? "var(--good)" : "var(--bad)";
  } else {
    picked = [...card.querySelectorAll("input:checked")].map(i=>+i.value);
    ok = picked.length===q.answer.length && picked.every(p=>q.answer.includes(p));
    card.querySelectorAll("label.opt").forEach(lab=>{
      const oi=+lab.dataset.oi;
      lab.querySelector("input").disabled=true;
      const isAns=q.answer.includes(oi), chosen=picked.includes(oi);
      if (isAns) { lab.classList.add("correct");
        const m=document.createElement("span"); m.className="mark g";
        m.textContent = chosen ? "correct" : "correct answer"; lab.appendChild(m); }
      else if (chosen) { lab.classList.add("wrong");
        const m=document.createElement("span"); m.className="mark b";
        m.textContent="your answer"; lab.appendChild(m); }
    });
  }

  card.querySelector(".checkbtn")?.remove();

  const why=document.createElement("div");
  why.className="why";
  why.innerHTML = `<b>${ok ? "Correct" : "Not quite"}</b>${q.why}`;
  card.appendChild(why);

  if (!ok) {
    const chosen = q.type==="fill"
      ? [] : picked.filter(i => !q.answer.includes(i));
    const missed = q.type==="fill"
      ? [] : q.answer.filter(i => !picked.includes(i));
    let html = "";
    chosen.forEach(i => {
      const custom = q.wrong && q.wrong[i];
      html += `<p><b>&ldquo;${optText(q,i)}&rdquo;</b> &mdash; ` +
        (custom || `not the answer here. The explanation above gives the one that is; the reading below settles it.`) + `</p>`;
    });
    if (q.type==="fill" && !ok) {
      html += `<p>The answer is <b>${q.answer[0]}</b>. ${(q.wrong && q.wrong.fill) || "Check the spelling and note that only the missing word goes in the box."}</p>`;
    }
    if (missed.length) {
      html += `<p><b>You missed:</b> ` + missed.map(i=>`&ldquo;${optText(q,i)}&rdquo;`).join(", ") +
        `. On a select-all, leaving a correct option out costs the same as adding a wrong one.</p>`;
    }
    if (html) {
      const wb=document.createElement("div");
      wb.className="wrongbox";
      wb.innerHTML=`<div class="l">Why your choice does not work</div>${html}`;
      card.appendChild(wb);
    }
  }

  const rn=document.createElement("div");
  rn.className="readnext";
  rn.innerHTML=`<div class="l">Read next</div>${linkify(q.src, q.bank)}` +
    `<div class="hint">Links open the file in the private repo. PDF page numbers are already converted, so <b>Koller book p. 16</b> opens at pdf page 53.</div>`;
  card.appendChild(rn);

  KX(card);
  done[qi]=ok;
  if (Object.keys(done).length === order.length) showScore();
  return ok;
}

function showScore() {
  const total=order.length;
  const correct=order.filter(qi=>done[qi]).length;
  const pct=Math.round(correct/total*100);
  scoreBox.hidden=false;
  scoreBox.innerHTML=`
    <h2>${sel.map(i=>BANKS[i].name.replace(/ - .*/,"")).join(" + ")}</h2>
    <div class="pct">${correct} / ${total} &middot; ${pct}%</div>
    <div class="bar"><div></div></div>
    <div class="breakdown">${
      pct===100 ? "Every one. Draw another set to be sure it wasn't the shuffle."
      : pct>=80 ? "Solid. Read the Read next line on anything you missed."
      : pct>=50 ? "Worth another pass through the sources before the next draw."
      : "Start with the source material, then come back."}</div>`;
  requestAnimationFrame(()=>{scoreBox.querySelector(".bar > div").style.width=pct+"%";});
  document.getElementById("retry").hidden=false;
  document.getElementById("submit").disabled=true;
  document.getElementById("submit2").disabled=true;
}

function gradeAll(){ order.forEach(qi=>checkOne(qi));
  scoreBox.scrollIntoView({behavior:"smooth",block:"start"}); }

document.getElementById("submit").onclick=gradeAll;
document.getElementById("submit2").onclick=gradeAll;
document.getElementById("retry").onclick=()=>{render();window.scrollTo({top:0,behavior:"smooth"});};
document.getElementById("newSet").onclick=()=>{build();window.scrollTo({top:0,behavior:"smooth"});};
document.getElementById("modeSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  mode=b.dataset.mode;paintChips();build();};

readURL(); paintChips(); build();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<script>
window.KX = function (root) {
  if (!window.renderMathInElement) return;
  try {
    renderMathInElement(root || document.body, {
      delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],
      throwOnError: false,
      ignoredTags: ["script","noscript","style","textarea","pre","option"]
    });
  } catch (e) {}
};
window.addEventListener("load", function(){ KX(); });
</script>
</body>
</html>
